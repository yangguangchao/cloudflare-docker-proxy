name = "cloudflare-docker-proxy"
compatibility_date = "2023-12-01"

[dev]
ip = "0.0.0.0"
port = 8787
local_protocol = "http"

[vars]
CUSTOM_DOMAIN = "guangchaoyang.cn"

[env.dev.vars]
MODE = "debug"
TARGET_UPSTREAM = "https://registry-1.docker.io"
CUSTOM_DOMAIN = "guangchaoyang.cn"

[env.production]
name = "cloudflare-docker-proxy"
routes = [
  { pattern = "docker.guangchaoyang.cn", custom_domain = true },
  { pattern = "quay.guangchaoyang.cn", custom_domain = true },
  { pattern = "gcr.guangchaoyang.cn", custom_domain = true },
  { pattern = "k8s-gcr.guangchaoyang.cn", custom_domain = true },
  { pattern = "k8s.guangchaoyang.cn", custom_domain = true },
  { pattern = "ghcr.guangchaoyang.cn", custom_domain = true },
  { pattern = "cloudsmith.guangchaoyang.cn", custom_domain = true },
]

[env.production.vars]
MODE = "production"
TARGET_UPSTREAM = ""
CUSTOM_DOMAIN = "guangchaoyang.cn"

[env.staging]
name = "cloudflare-docker-proxy-staging"
# route = { pattern = "docker-staging.libcuda.so", custom_domain = true }

[env.staging.vars]
MODE = "staging"
TARGET_UPSTREAM = ""
